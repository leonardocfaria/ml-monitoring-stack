groups:
  - name: model
    rules:
      - alert: FeatureDrift
        expr: max by (feature) (model_feature_psi) > 0.2
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Input drift on {{ $labels.feature }} (PSI {{ $value | printf \"%.2f\" }})"
          description: "PSI of the last 500 requests vs training data above 0.2: retraining may be needed."
      - alert: ConceptDrift
        expr: model_rolling_accuracy < 0.75
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Rolling accuracy {{ $value | printf \"%.2f\" }} < 0.75"
          description: "Labelled feedback shows the model is wrong more often: the input-output relation changed."
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(model_request_latency_seconds_bucket[1m]))) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "p95 /predict latency {{ $value | printf \"%.3f\" }} s > 100 ms"
