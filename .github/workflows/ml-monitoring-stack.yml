name: ml-monitoring-stack
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: .
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: promtool check config + rules
        run: docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
  stack:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: docker compose up -d --build
      - run: for i in $(seq 60); do curl -sf localhost:8000/health && curl -sf localhost:9090/-/ready && break; sleep 2; done; curl -sf localhost:9090/-/ready
      - run: python e2e_check.py
      - if: always()
        run: docker compose logs --tail 50; docker compose down
